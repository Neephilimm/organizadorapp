name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar web (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}

      - name: Agregar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generar íconos
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111111'

      - name: Registrar el enlace personalizado (deep link) en Android
        run: |
          cat > /tmp/patch_manifest.py << 'PYEOF2'
          ruta = "android/app/src/main/AndroidManifest.xml"
          with open(ruta) as f:
              manifest = f.read()

          def filtro_para(esquema):
              return (
                  "\n            <intent-filter>\n"
                  '                <action android:name="android.intent.action.VIEW" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />\n'
                  '                <category android:name="android.intent.category.BROWSABLE" />\n'
                  f'                <data android:scheme="{esquema}" />\n'
                  "            </intent-filter>\n"
              )

          esquemas = [
              "cl.organizador.academico",
              "com.googleusercontent.apps.78278139529-jm0ji532o6u3b4sode9nhg8btah80t7q",
          ]

          cambiado = False
          for esquema in esquemas:
              if esquema not in manifest:
                  manifest = manifest.replace("</activity>", filtro_para(esquema) + "        </activity>", 1)
                  cambiado = True
                  print(f"Intent-filter agregado: {esquema}")
              else:
                  print(f"Ya estaba presente: {esquema}")

          if cambiado:
              with open(ruta, "w") as f:
                  f.write(manifest)
          PYEOF2
          python3 /tmp/patch_manifest.py
          cat android/app/src/main/AndroidManifest.xml

      - name: Compilar APK (debug)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: organizador-academico-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
